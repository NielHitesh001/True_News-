# Neutralization Rules Configuration (M5)
# Normative dictionary of loaded categories, replacements, and factual preservation whitelist (spec §6).

categories:
  intensifiers:
    - match: "\\bstaggering\\b"
      replacement: ""
      rationale: "Removed emotive scale intensifier; numerical amount is preserved"
    - match: "\\bmassive\\b"
      replacement: "large-scale"
      rationale: "Replaced hyperbolic intensifier with neutral scale descriptor"
    - match: "\\bbombshell\\b"
      replacement: "unexpected"
      rationale: "Replaced dramatic intensifier with neutral event descriptor"
    - match: "\\bdevastating toll\\b"
      replacement: "toll"
      rationale: "Removed emotive intensifier; casualty counts remain in facts"
    - match: "\\bhistoric\\b"
      replacement: ""
      rationale: "Removed evaluative significance label"
    - match: "\\bdisastrous\\b"
      replacement: ""
      rationale: "Removed polemical evaluative adjective"

  emotive_adjectives:
    - match: "\\bbrazen\\b"
      replacement: ""
      rationale: "Removed moral judgment adjective"
    - match: "\\bcowardly\\b"
      replacement: ""
      rationale: "Removed character judgment adjective"
    - match: "\\bcontroversial\\b"
      replacement: ""
      rationale: "Removed subjective framing label"
    - match: "\\bshamefully\\b"
      replacement: ""
      rationale: "Removed evaluative judgment adverb"
    - match: "\\btriumphantly\\b"
      replacement: ""
      rationale: "Removed emotional framing adverb"
    - match: "\\bunprovoked\\b"
      replacement: ""
      rationale: "Removed subjective motive assertion"

  charged_verbs:
    - match: "\\bslammed\\b"
      replacement: "criticized"
      rationale: "Replaced sensationalized conflict verb with standard reportorial verb"
    - match: "\\bcaved in to\\b"
      replacement: "agreed with"
      rationale: "Replaced disparaging surrender metaphor with factual agreement verb"
    - match: "\\bdeliberately rammed\\b"
      replacement: "collided with"
      rationale: "Replaced attributed intention with verifiable physical occurrence"
    - match: "\\bdesecrate\\b"
      replacement: "affect"
      rationale: "Replaced loaded moral term with plain descriptive verb"

  loaded_labels:
    - match: "['\"]so-called\\s+([^'\"]+)['\"]"
      replacement: "\\1"
      rationale: "Removed delegitimizing scare quotes and 'so-called' prefix"
    - match: "\\bregime\\b"
      replacement: "government"
      rationale: "Replaced pejorative institutional label with standard neutral noun"

factual_whitelist:
  - "hospitalized"
  - "injured"
  - "killed"
  - "died"
  - "evacuated"
  - "arrested"
  - "detained"
  - "fined"
  - "struck"
  - "collapsed"
  - "collided"
  - "closed"
  - "reopened"
