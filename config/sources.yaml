    name: National Transportation Safety Board (NTSB)
    tier: primary
    ownership: US Federal Government
    funding: US Federal Appropriations (Public)
    region: North America (US)
    language: en
    medium: official
    leaning_notes: Independent US government investigative agency; non-partisan official findings
    correction_history: []
    status: active
    full_text_retrievable: true
    access_notes: Public domain government reports; no paywall; respectful rate limits

