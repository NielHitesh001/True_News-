# Source Registry Configuration
# Normative source profiles per spec Section 5.
# Sources are tiered:
#   primary   = official records, filings, transcripts, statistical bureaus, court decisions
#   secondary = wires and original reporting
#   tertiary  = aggregators and commentary (excluded from core fact base)

sources:
